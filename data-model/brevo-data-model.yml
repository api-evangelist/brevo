description: >-
  The entity graph behind the Brevo API, derived from schema properties and id-reference
  fields across the 285 published operations. Contact is the hub: nearly every other domain
  — campaigns, CRM, ecommerce, loyalty, events, conversations, wallet — hangs off it by a
  contact identifier. Brevo is unusual in that a Contact has several co-equal identity keys
  (email_id, phone_id, whatsapp_id, landline_number_id, ext_id) rather than one primary key,
  and most contact-scoped paths take a generic `{identifier}` segment that accepts any of
  them. Identifiers are plain integers or UUIDs; Brevo uses no typed id prefixes.
id_conventions:
  style: integer or UUID, per resource
  prefixes: none
  note: >-
    Loyalty and Events use UUIDs (programs, subscriptions, transactions); contacts, lists,
    campaigns, deals and products use integer ids. Custom-object records are addressed by
    an `object_type` path segment plus a record identifier.
  contact_identifier: >-
    Contact-scoped paths take {identifier}, which resolves against any of email_id,
    phone_id, whatsapp_id, landline_number_id, ext_id or the numeric contact id.
