policies:
  - name: Distribute requests evenly
    description: >-
      Brevo's own guidance — calculate the allowance and spread requests evenly across the
      window rather than bursting (1,000 RPS supports 60,000 requests/minute when even).
  - name: Read the headers, do not poll
    description: >-
      Check x-sib-ratelimit-remaining before issuing a request; back off for
      x-sib-ratelimit-reset seconds. No Retry-After is sent.
  - name: Use webhooks instead of statistics polling
    description: >-
      Brevo explicitly recommends webhooks over polling the statistics endpoints, which sit
      under the 300 RPH /v3/smtp/{...} bucket.
  - name: Tiered capacity
    description: Capacity is bound to account tier; Advanced requires Professional or Enterprise, Extended requires Enterprise.
platform_quotas:
  docs: https://developers.brevo.com/docs/platform-quotas
  note: >-
    Separate from rate limits — object-creation ceilings (campaigns, contacts, lists,
    templates) per plan. Rate limits cap request frequency; quotas cap object counts.
