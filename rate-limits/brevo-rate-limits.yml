description: >-
  Brevo publishes a complete per-endpoint rate-limit table across three account tiers —
  General (all accounts), Advanced (Professional and Enterprise) and Extended (Enterprise
  only) — expressed in both requests per second (RPS) and requests per hour (RPH). Where an
  endpoint carries both, both must be respected simultaneously. The spread is extreme: the
  transactional send endpoint allows 1,000 RPS on the free tier while every unlisted
  endpoint is capped at 100 requests per HOUR, which is the number that actually constrains
  most integrations. Exhaustion returns 429 and every response carries vendor-prefixed
  x-sib-ratelimit-* headers; there is no Retry-After.
sources:
  - https://developers.brevo.com/docs/api-limits
  - https://developers.brevo.com/docs/limit-headers
responseCodes:
  throttled: 429
headers:
  fields:
    - name: x-sib-ratelimit-limit
      description: Maximum number of requests allowed in the current time window before a 429
    - name: x-sib-ratelimit-remaining
      description: Number of requests remaining in the current time window
    - name: x-sib-ratelimit-reset
      description: Time until the rate limit resets, in the granularity unit (typically seconds)
  retry_after: false
  standard: vendor-prefixed
  note: >-
    Brevo uses the legacy Sendinblue x-sib-* prefix rather than the IETF RateLimit-* draft
    fields, and sends no Retry-After on 429 — an agent must read x-sib-ratelimit-reset.
  applies_to: all rate-limited endpoints
tiers:
  - {name: General, availability: 'All account types (Free, Starter, Standard, Professional, Enterprise)'}
  - {name: Advanced, availability: Professional and Enterprise accounts}
  - {name: Extended, availability: Enterprise accounts}
