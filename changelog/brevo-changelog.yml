description: >-
  Brevo runs a dated developer changelog on its Fern-hosted portal, with entries back to
  March 2023 and a machine-readable index at /changelog/llms.txt. Entries are explicitly
  sectioned into "Breaking changes" and "Added", and breaking changes carry effective dates
  — which makes this one of the more agent-legible changelogs in the marketing-API cohort.
  There is no semantic version on the API itself; the version stays v3 in the URI path and
  change is communicated entirely through this feed and the per-SDK release notes.
