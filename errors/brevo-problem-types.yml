- status: 400
  title: Bad request
  count: 241
  description: >-
    The most common failure across the surface. Returned with an errorModel body carrying
    one of invalid_parameter / missing_parameter / out_of_range / duplicate_parameter.
  source_operations: openapi/brevo-*-openapi.yml (241 declarations)
- status: 401
  title: Request Authentication Failed
  count: 65
  description: >-
    The `api-key` header is absent or unrecognised. Confirmed live — an unauthenticated GET
    to https://api.brevo.com/v3/openapi.json returns
    {"message":"authentication not found in headers","code":"unauthorized"}.
- status: 402
  title: Not enough credits
  count: 2
  description: >-
    "You don't have enough credit to send your campaign." Distinctive to a credit-metered
    messaging platform; an agent must treat this as a billing condition, not a retryable
    error.
- status: 403
  title: Cannot Authenticate Request
  count: 72
  description: >-
    Authenticated but not permitted. Also carries feature-gate refusals — e.g. "Consent
    Groups feature not enabled for this account" (CONSENT_GROUP_NOT_ENABLED) and "Current
    account is not a master account" on the /corporate endpoints.
