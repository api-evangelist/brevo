rfc9457: false
description: >-
  Brevo does not use RFC 9457 application/problem+json. Every error response across the 285
  published operations returns a flat JSON object of {code, message} — `code` a
  machine-readable slug from a fixed enumeration, `message` a human-readable string. A few
  contact operations add an optional `metadata` object. This catalog is derived from the
  error-code enums and the 4xx/5xx response declarations in the published specs; nothing
  here is invented, and where the specs give no title beyond "bad request" that is recorded
  rather than embellished.
envelope:
  fields:
    code: string — machine-readable error code from the enum below
    message: string — readable message associated to the failure
    metadata: object — optional, additional information (contact endpoints only)
  required: [message]
  example: '{"code":"invalid_parameter","message":"Invalid email address"}'
  schema_names: [errorModel, contactErrorModel]
error_codes:
- {code: invalid_parameter, meaning: A supplied parameter value is not valid, typical_status: 400}
- {code: missing_parameter, meaning: A required parameter was not supplied, typical_status: 400}
- {code: out_of_range, meaning: A parameter value is outside the accepted range, typical_status: 400}
- {code: bad_request, meaning: Generic malformed request, typical_status: 400}
- {code: unauthorized, meaning: API key missing or not recognised, typical_status: 401}
- {code: permission_denied, meaning: Key is valid but not entitled to this operation or resource, typical_status: 403}
- {code: document_not_found, meaning: The referenced object does not exist, typical_status: 404}
- {code: method_not_allowed, meaning: HTTP method not permitted on this resource, typical_status: 405}
- {code: not_acceptable, meaning: Requested representation is not available, typical_status: 406}
- {code: duplicate_parameter, meaning: 'A uniqueness constraint was violated — also the code returned when an idempotencyKey is replayed inside its 30-minute TTL', typical_status: 400}
- {code: duplicate_request, meaning: The same request is already in flight, typical_status: 409}
- {code: unprocessable_entity, meaning: Syntactically valid but semantically rejected, typical_status: 422}
- {code: not_enough_credits, meaning: Account has insufficient email/SMS credits to complete the send, typical_status: 402}
- {code: campaign_processing, meaning: The campaign is currently being processed and cannot be modified, typical_status: 400}
- {code: campaign_sent, meaning: The campaign has already been sent and cannot be modified, typical_status: 400}
- {code: account_under_validation, meaning: Account is pending validation; sending is blocked, typical_status: 403}
- {code: account_in_process, meaning: Account operation still in progress, typical_status: 400}
