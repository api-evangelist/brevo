specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Brevo
providerId: brevo
created: '2026-05-04'
generated: '2026-08-13'
method: searched
source: https://www.brevo.com/pricing/
modified: '2026-08-13'
reconciled: true
tags:
  - Email
  - Transactional
  - SMS
  - Marketing
  - CRM
  - Automation
description: >-
  Brevo bills its marketing platform on email send volume, not contact count — contacts are
  unlimited on paid tiers and capped generously on Free. The ladder read from the live
  pricing page on 2026-08-13 is Free, Starter, Standard, Professional and Enterprise; the
  "Business" tier recorded in earlier sweeps of this file no longer exists, having been
  split into Standard and Professional. Prices are rendered client-side on
  https://www.brevo.com/pricing/ and are volume- and currency-dependent, so per-tier price
  values are recorded as null with the pricing URL rather than hard-coded to a number that
  would go stale; the feature and quota boundaries between tiers, which are in the served
  HTML, are captured verbatim. Billing is monthly or yearly (yearly discounted 10%). The
  API itself is not separately metered — API access is included on every tier, including
  Free, and what the plan governs is send volume, channels and seats. SMS and WhatsApp
  credits are sold separately from the subscription on every tier.
sources:
  - https://www.brevo.com/pricing/
  - https://developers.brevo.com/docs/api-limits
  - https://developers.brevo.com/docs/platform-quotas
billing:
  periods: [monthly, yearly]
  yearly_discount: '10%'
  currency: multiple (localized)
  price_visibility: js-rendered
  note: >-
    Tier prices are injected by client-side script and vary by email volume slider and
    locale; they are not present in the served HTML.
plan_count: 5
plans:
  - id: brevo-free
    name: Free
    type: freemium
    price: 0
    description: >-
      Free forever, no credit card. Aimed at individuals and solopreneurs. Includes API
      access and transactional email, under a daily send cap.
    entries:
      - label: Email send limit
        name: emails
        type: quota
        metric: email
        limit: 300
        timeFrame: day
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: Email & transactional messages
      - name: Drag & drop email editor
      - name: Email templates
      - name: Full REST API access
      - name: No credit card required
  - id: brevo-starter
    name: Starter
    type: subscription
    price: null
    price_note: Volume-scaled; see https://www.brevo.com/pricing/
    description: >-
      Entry paid tier for single users starting with email and multi-channel marketing.
      Removes the daily send cap; monthly send allowance starts at 5,000 emails.
    entries:
      - label: Included email volume (entry)
        name: emails
        type: quota
        metric: email
        limit: 5000
        timeFrame: month
        geo: global
        unit: 1
        price: null
        userMultiplied: false
    elements:
      - name: From 5,000 emails per month
      - name: Email & SMS (SMS credits sold separately)
      - name: AI content generator
      - name: Advanced segmentation (unlimited segments)
      - name: Forms
      - name: Basic reporting & analytics
      - name: Email support in 6 languages
      - name: 'Optional add-on: remove Brevo logo'
  - id: brevo-standard
    name: Standard
    type: subscription
    price: null
    price_note: Volume-scaled; see https://www.brevo.com/pricing/
    description: >-
      Marked "Most Popular" on the pricing page. For small businesses ready to automate and
      test campaigns. Everything in Starter plus automation and testing.
    entries:
      - label: Landing pages included
        name: landing_pages
        type: quota
        metric: page
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: null
        userMultiplied: false
    elements:
      - name: Marketing automation (unlimited multi-step workflows)
      - name: A/B testing
      - name: Advanced email reporting (click heatmaps, geography, device)
      - name: AI send time optimization
      - name: Web & event tracking
      - name: Landing pages (1 included)
      - name: No Brevo logo
  - id: brevo-professional
    name: Professional
    type: subscription
    price: null
    price_note: Volume-scaled; see https://www.brevo.com/pricing/
    description: >-
      For teams using data and AI across channels. This is the tier at which the API's
      Advanced rate-limit band unlocks (2,000 RPS on transactional send vs 1,000).
    entries:
      - label: Included email volume (entry)
        name: emails
        type: quota
        metric: email
        limit: 150000
        timeFrame: month
        geo: global
        unit: 1
        price: null
        userMultiplied: false
      - label: Included seats
        name: seats
        type: quota
        metric: user
        limit: 10
        timeFrame: month
        geo: global
        unit: 1
        price: null
        userMultiplied: false
      - label: Deliverability specialist support
        name: deliverability_support
        type: quota
        metric: hour
        limit: 3
        timeFrame: year
        geo: global
        unit: 1
        price: null
        userMultiplied: false
    elements:
      - name: From 150,000 emails per month
      - name: WhatsApp, popups, mobile & web push
      - name: 10 seats included
      - name: Contact scoring (RFM, CLV)
      - name: Advanced ecommerce (AI recommendations, back-in-stock alerts, coupons)
      - name: AI segmentation (Aura AI)
      - name: AI Data Analyst
      - name: Phone support
      - name: Advanced API rate-limit tier
  - id: brevo-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    description: >-
      Custom-priced, sales-gated. Aimed at companies with 1M+ contacts needing full data
      control. Unlocks the Extended API rate-limit band (6,000 RPS transactional send) and
      the multi-account / custom-object surface exposed by the corporate and object
      management APIs.
    entries:
      - label: Custom subscription
        name: custom_subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Multi-account management (master account + sub-accounts)
      - name: Custom objects
      - name: Brevo Mobile Wallet
      - name: Extended API rate-limit tier
      - name: Enterprise-grade security and data control
      - name: Tailored onboarding
add_ons:
  - name: SMS credits
    note: Sold separately from the subscription on all tiers.
  - name: WhatsApp credits
    note: Sold separately; channel available from Professional.
  - name: Sales Essentials / Sales Advanced
    note: Priced per month (Essentials) or per month per user (Advanced), separate from the marketing tier.
api_access:
  metered_separately: false
  available_on_free: true
  note: >-
    API access is included on every tier. What changes with the plan is send volume,
    available channels, seats and the rate-limit band — see rate-limits/brevo-rate-limits.yml.
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
