arazzo: 1.0.1
info:
  title: Brevo contact to Google Sheets row
  summary: Brevo contact to Google Sheets row
  description: Brevo lists Google Sheets ("Turn Google Sheets rows ... into up-to-date contacts"). This direction reads a
    Brevo contact and appends it as a row.
  version: 1.0.0
sourceDescriptions:
- name: brevoContacts
  url: https://raw.githubusercontent.com/api-evangelist/brevo/refs/heads/main/openapi/brevo-contacts-api-openapi.yml
  type: openapi
- name: googleSheetsValues
  url: https://raw.githubusercontent.com/api-evangelist/google-sheets/refs/heads/main/openapi/google-sheets-values-api-openapi.yml
  type: openapi
workflows:
- workflowId: brevo-contact-to-google-sheet-row
  summary: Brevo contact to Google Sheets row
  description: Brevo lists Google Sheets ("Turn Google Sheets rows ... into up-to-date contacts"). This direction reads a
    Brevo contact and appends it as a row.
  inputs:
    type: object
    properties:
      identifier:
        type: string
        description: Brevo contact email or id
      spreadsheetId:
        type: string
        description: Google spreadsheet id
      range:
        type: string
        description: A1 range, e.g. Sheet1!A1
  steps:
  - stepId: get-contact
    description: Read the Brevo contact.
    operationId: $sourceDescriptions.brevoContacts.getContactInfo
    parameters:
    - name: identifier
      in: path
      value: $inputs.identifier
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/email
      id: $response.body#/id
      createdAt: $response.body#/createdAt
  - stepId: append-row
    description: Append the contact as a row.
    operationId: $sourceDescriptions.googleSheetsValues.appendValues
    parameters:
    - name: spreadsheetId
      in: path
      value: $inputs.spreadsheetId
    - name: range
      in: path
      value: $inputs.range
    - name: valueInputOption
      in: query
      value: RAW
    requestBody:
      contentType: application/json
      payload:
        values:
        - - $steps.get-contact.outputs.id
          - $steps.get-contact.outputs.email
          - $steps.get-contact.outputs.createdAt
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      updatedRange: $response.body#/updates/updatedRange
  outputs: {}
