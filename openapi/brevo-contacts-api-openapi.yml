  /contacts:
    get:
      operationId: getContacts
      summary: Get all the contacts
      description: Retrieve all contacts from your Brevo account with support for pagination, filtering, and sorting. Results default to 50 contacts per page (maximum 1000) sorted in descending order of creation, and can be filtered by modification date, creation date, contact IDs (up to 20), list IDs, segment ID, or contact attributes using the equals operator. Note that either listIds or segmentId can be passed but not both simultaneously.
      tags:
      - Contacts
      parameters:
      - name: limit
        in: query
        description: Number of documents per page
        required: false
        schema:
          type: integer
          format: int64
          default: 50
      - name: offset
        in: query
        description: Index of the first document of the page
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: modifiedSince
        in: query
        description: 'Filter (urlencoded) the contacts modified after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ). **Prefer to pass your timezone in date-time format for accurate result.**

          '
        required: false
        schema:
          type: string
      - name: createdSince
        in: query
        description: 'Filter (urlencoded) the contacts created after a given UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ). **Prefer to pass your timezone in date-time format for accurate result.**

          '
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Sort the results in the ascending/descending order of record creation. Default order is **descending** if `sort` is not passed
        required: false
        schema:
          $ref: '#/components/schemas/ContactsGetParametersSort'
          default: desc
      - name: ids
        in: query
        description: Filter by a list of contact IDs. You can pass a **maximum of 20 IDs**. All elements must be integers.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: segmentId
        in: query
        description: Id of the segment. **Either listIds or segmentId can be passed.** Must be a positive integer (minimum value of 1).
        required: false
        schema:
          type: integer
          format: int64
      - name: listIds
        in: query
        description: Ids of the list. **Either listIds or segmentId can be passed.**
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: filter
        in: query
        description: 'Filter the contacts on the basis of attributes. **Allowed operator: equals. For multiple-choice options, the filter will apply an AND condition between the options. For category attributes, the filter will work with both id and value. (e.g. filter=equals(FIRSTNAME,"Antoine"), filter=equals(B1, true), filter=equals(DOB, "1989-11-23"), filter=equals(GENDER, "1"), filter=equals(GENDER, "MALE"), filter=equals(COUNTRY,"USA, INDIA")**

          '
        required: false
        schema:
          type: string
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All contacts listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getContacts'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactsRequestBadRequestError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
    post:
      operationId: createContact
      summary: Create a contact
      description: 'Follow this format when passing a "SMS" phone number as an attribute.

        Accepted Number Formats 91xxxxxxxxxx +91xxxxxxxxxx 0091xxxxxxxxxx

        Creates new contacts on Brevo. Contacts can be created by passing either -


        1. email address of the contact (email_id),

        2. phone number of the contact (to be passed as "SMS" field in "attributes" along with proper country code), For example- {"SMS":"+91xxxxxxxxxx"} or {"SMS":"0091xxxxxxxxxx"}

        3. ext_id'
      tags:
      - Contacts
      parameters:
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacts_createContact_Response_201'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactErrorModel'
        '425':
          description: Too Early
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactErrorModel'
      requestBody:
        description: Values to create a contact
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/ContactsPostRequestBodyContentApplicationJsonSchemaAttributes'
                  description: 'Pass the set of attributes and their values. The attribute''s parameter should be passed in capital letter while creating a contact. Values that don''t match the attribute type (e.g. text or string in a date attribute) will be ignored. **These attributes must be present in your Brevo account**. For eg: **{"FNAME":"Elly", "LNAME":"Roger", "COUNTRIES": ["India","China"]}**

                    '
                email:
                  type: string
                  format: email
                  description: 'Email address of the user. **Mandatory if "ext_id"  & "SMS" field is not passed.**

                    '
                emailBlacklisted:
                  type: boolean
                  description: Set this field to blacklist the contact for emails (emailBlacklisted = true)
                ext_id:
                  type: string
                  description: Pass your own Id to create a contact.
                listIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Ids of the lists to add the contact to
                smsBlacklisted:
                  type: boolean
                  description: Set this field to blacklist the contact for SMS (smsBlacklisted = true)
                smtpBlacklistSender:
                  type: array
                  items:
                    type: string
                    format: email
                  description: transactional email forbidden sender for contact. Use only for email Contact ( only available if updateEnabled = true )
                updateEnabled:
                  type: boolean
                  default: false
                  description: Facilitate to update the existing contact in the same request (updateEnabled = true)
                forceMerge:
                  type: boolean
                  default: false
                  description: When true, if the contact being created shares an identifier (email, SMS, ext_id, whatsapp, landline) with an existing contact, the two contacts are force-merged. The contact with the most recent `last_modified` timestamp is retained; the other is deleted. When false (default), a 4xx error is returned on identifier conflict.
                getId:
                  type: boolean
                  default: false
                  description: When true, the response returns the `id` of the surviving contact after merge.
  /contacts/doubleOptinConfirmation:
    post:
      operationId: createDoiContact
      summary: Create Contact via DOI (Double-Opt-In) Flow
      description: attributes param in this endpoint is an object containing key-value pairs where values can be either a string, integer, array, or boolean. You can create key-value pairs with these four datatypes. When a value is an array, it should be an array of strings.
      tags:
      - Contacts
      parameters:
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: DOI Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacts_createDoiContact_Response_201'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDoiContactRequestBadRequestError'
      requestBody:
        description: Values to create the Double opt-in (DOI) contact
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/ContactsDoubleOptinConfirmationPostRequestBodyContentApplicationJsonSchemaAttributes'
                  description: 'Pass the set of attributes and their values. **These attributes must be present in your Brevo account**. For eg. **{''FNAME'':''Elly'', ''LNAME'':''Roger'', ''COUNTRIES'': [''India'',''China'']}**

                    '
                email:
                  type: string
                  format: email
                  description: Email address where the confirmation email will be sent. This email address will be the identifier for all other contact attributes.
                excludeListIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Lists under user account where contact should not be added
                includeListIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Lists under user account where contact should be added
                redirectionUrl:
                  type: string
                  format: url
                  description: 'URL of the web page that user will be redirected to after clicking on the double opt in URL. When editing your DOI template you can reference this URL by using the tag **{{ params.DOIurl }}**.

                    '
                templateId:
                  type: integer
                  format: int64
                  description: Id of the Double opt-in (DOI) template
              required:
              - email
              - includeListIds
              - redirectionUrl
              - templateId
  /contacts/{identifier}:
    get:
      operationId: getContactInfo
      summary: Get a contact's details
      description: 'Follow this format when passing a "SMS" phone number as an attribute.

        Accepted Number Formats 91xxxxxxxxxx +91xxxxxxxxxx 0091xxxxxxxxxx

        There are 2 ways to get a contact


        Option 1- https://api.brevo.com/v3/contacts/{identifier}


        Option 2- https://api.brevo.com/v3/contacts/{identifier}?identifierType={}


        Option 1 only works if identifierType is email_id (for EMAIL), phone_id (for SMS) or contact_id (for ID of the contact),where you can directly pass the value of EMAIL, SMS and ID of the contact.


        Option 2 works for all identifierType, use email_id for EMAIL attribute, phone_id for SMS attribute, contact_id for ID of the contact, ext_id for EXT_ID attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE_NUMBER attribute


        Along with the contact details, this endpoint will show the statistics of contact for the recent 90 days by default. To fetch the earlier statistics, please use Get contact campaign stats ``https://developers.brevo.com/reference/contacts-7#getcontactstats`` endpoint with the appropriate date ranges.'
      tags:
      - Contacts
      parameters:
      - name: identifier
        in: path
        description: Email (urlencoded) OR ID of the contact OR its SMS attribute value OR EXT_ID attribute (urlencoded)
        required: true
        schema:
          $ref: '#/components/schemas/ContactsIdentifierGetParametersIdentifier'
      - name: identifierType
        in: query
        description: email_id for Email, phone_id for SMS attribute, contact_id for ID of the contact, ext_id for EXT_ID attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE_NUMBER attribute
        required: false
        schema:
          $ref: '#/components/schemas/ContactsIdentifierGetParametersIdentifierType'
      - name: startDate
        in: query
        description: '**Mandatory if endDate is used.** Starting date (YYYY-MM-DD) of the statistic events specific to campaigns. Must be lower than equal to endDate. Must not be greater than the current date.

          '
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        description: '**Mandatory if startDate is used.** Ending date (YYYY-MM-DD) of the statistic events specific to campaigns. Must be greater than equal to startDate. Must not be greater than the current date.

          '
        required: false
        schema:
          type: string
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Contact informations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacts_getContactInfo_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactInfoRequestBadRequestError'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
    delete:
      operationId: deleteContact
      summary: Delete a contact
      description: 'There are 2 ways to delete a contact


        Option 1- https://api.brevo.com/v3/contacts/{identifier}


        Option 2- https://api.brevo.com/v3/contacts/{identifier}?identifierType={}


        Option 1 only works if identifierType is email_id (for EMAIL) or contact_id (for ID of the contact),where you can directly pass the value of EMAIL and ID of the contact.


        Option 2 works for all identifierType, use email_id for EMAIL attribute, contact_id for ID of the contact, ext_id for EXT_ID attribute, phone_id for SMS attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE_NUMBER attribute.'
      tags:
      - Contacts
      parameters:
      - name: identifier
        in: path
        description: Email (urlencoded) OR ID of the contact OR EXT_ID attribute (urlencoded)
        required: true
        schema:
          $ref: '#/components/schemas/ContactsIdentifierDeleteParametersIdentifier'
      - name: identifierType
        in: query
        description: email_id for Email, contact_id for ID of the contact, ext_id for EXT_ID attribute, phone_id for SMS attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE_NUMBER attribute
        required: false
        schema:
          $ref: '#/components/schemas/ContactsIdentifierDeleteParametersIdentifierType'
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteContactRequestBadRequestError'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '405':
          description: You're not allowed to delete registered email contact with Brevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
    put:
      operationId: updateContact
      summary: Update a contact
      description: 'Follow this format when passing a "SMS" phone number as an attribute.

        Accepted Number Formats 91xxxxxxxxxx +91xxxxxxxxxx 0091xxxxxxxxxx


        If a blocklisted contact''s email address is updated, it is going to remove that blocklisting from the contact and they will be resubscribed.

        There are 2 ways to update a contact


        Option 1- https://api.brevo.com/v3/contacts/{identifier}


        Option 2- https://api.brevo.com/v3/contacts/{identifier}?identifierType={}


        Option 1 only works if identifierType is email_id (for EMAIL) or contact_id (for ID of the contact),where you can directly pass the value of EMAIL and ID of the contact.


        Option 2 works for all identifierType, use email_id for EMAIL attribute, contact_id for ID of the contact, ext_id for EXT_ID attribute, phone_id for SMS attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE attribute'
      tags:
      - Contacts
      parameters:
      - name: identifier
        in: path
        description: Email (urlencoded) OR ID of the contact OR EXT_ID attribute (urlencoded) OR its SMS attribute value OR its WHATSAPP attribute value OR its LANDLINE_NUMBER attribute value
        required: true
        schema:
          $ref: '#/components/schemas/ContactsIdentifierPutParametersIdentifier'
      - name: identifierType
        in: query
        description: email_id for Email, contact_id for ID of the contact, ext_id for EXT_ID attribute, phone_id for SMS attribute, whatsapp_id for WHATSAPP attribute, landline_number_id for LANDLINE_NUMBER attribute
        required: false
        schema:
          $ref: '#/components/schemas/ContactsIdentifierPutParametersIdentifierType'
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactErrorModel'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactErrorModel'
        '425':
          description: Too Early
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contactErrorModel'
      requestBody:
        description: Values to update a contact
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/ContactsIdentifierPutRequestBodyContentApplicationJsonSchemaAttributes'
                  description: 'Pass the set of attributes to be updated. **These attributes must be present in your account**. To update existing email address of a contact with the new one please pass EMAIL in attributes. For example, **{ "EMAIL":"newemail@domain.com", "FNAME":"Ellie", "LNAME":"Roger", "COUNTRIES":["India","China"]}**. The attribute''s parameter should be passed in capital letter while updating a contact. Values that don''t match the attribute type (e.g. text or string in a date attribute) will be ignored .Keep in mind transactional attributes can be updated the same way as normal attributes. Mobile Number in **SMS** field should be passed with proper country code. For example: **{"SMS":"+91xxxxxxxxxx"} or {"SMS":"0091xxxxxxxxxx"}**

                    '
                emailBlacklisted:
                  type: boolean
                  description: Set/unset this field to blacklist/allow the contact for emails (emailBlacklisted = true)
                ext_id:
                  type: string
                  description: Pass your own Id to update ext_id of a contact.
                listIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Ids of the lists to add the contact to
                smsBlacklisted:
                  type: boolean
                  description: Set/unset this field to blacklist/allow the contact for SMS (smsBlacklisted = true)
                smtpBlacklistSender:
                  type: array
                  items:
                    type: string
                    format: email
                  description: transactional email forbidden sender for contact. Use only for email Contact
                unlinkListIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Ids of the lists to remove the contact from
                forceMerge:
                  type: boolean
                  default: false
                  description: When true, if the contact being updated shares an identifier (email, SMS, ext_id, whatsapp, landline) with an existing contact, the two contacts are force-merged. The contact with the most recent `last_modified` timestamp is retained; the other is deleted. When false (default), a 4xx error is returned on identifier conflict.
