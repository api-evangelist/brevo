openapi: 3.2.0
info:
  title: Accounts and Settings User API
  version: 1.0.0
servers:
- url: https://api.brevo.com/v3
  description: https://api.brevo.com/v3
tags:
- name: User
paths:
  /organization/invited/users:
    get:
      operationId: getInvitedUsersList
      summary: Get the list of all your users
      description: Retrieves the list of all users associated with your organization, including both active and pending invited users. Each user entry includes their email address, owner status, current invitation status, and feature access levels for marketing, CRM, and conversations.
      tags:
      - User
      parameters:
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: list of all your users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_getInvitedUsersList_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvitedUsersListRequestBadRequestError'
  /organization/user/{email}/permissions:
    get:
      operationId: getUserPermission
      summary: Check user permission
      description: Retrieves the granular feature-level permissions assigned to a specific user in the organization, identified by their email address. The response includes the user''s current status (active or pending) and a detailed list of privileges specifying which features and permission levels are granted.
      tags:
      - User
      parameters:
      - name: email
        in: path
        description: Email of the invited user.
        required: true
        schema:
          type: string
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: list of all the user's permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_getUserPermission_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserPermissionRequestBadRequestError'
  /organization/user/invitation/revoke/{email}:
    put:
      operationId: putRevokeUserPermission
      summary: Revoke user permission
      description: Revokes all permissions for an invited user in the organization, effectively removing their access to the platform. If the user''s plan change generated credit notes, they are returned in the response for billing reconciliation.
      tags:
      - User
      parameters:
      - name: email
        in: path
        description: Email of the invited user.
        required: true
        schema:
          type: string
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credit note exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_putRevokeUserPermission_Response_200'
        '403':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutRevokeUserPermissionRequestForbiddenError'
  /organization/user/invitation/{action}/{email}:
    put:
      operationId: putresendcancelinvitation
      summary: Resend / Cancel invitation
      description: Resends or cancels a pending invitation for a user in the organization, depending on the action path parameter. Use `resend` to send a new invitation email to the user, or `cancel` to revoke the pending invitation entirely and remove the user''s pending access.
      tags:
      - User
      parameters:
      - name: action
        in: path
        description: action
        required: true
        schema:
          $ref: '#/components/schemas/OrganizationUserInvitationActionEmailPutParametersAction'
      - name: email
        in: path
        description: Email of the invited user.
        required: true
        schema:
          type: string
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_putresendcancelinvitation_Response_200'
        '403':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutresendcancelinvitationRequestForbiddenError'
  /organization/user/invitation/send:
    post:
      operationId: inviteuser
      summary: Send invitation to user
      description: '`Feature` - A Feature represents a specific functionality like Email

        campaign, Deals, Calls, Automations, etc. on Brevo. While inviting a user,

        determine which feature you want to manage access to. You must specify the

        feature accurately to avoid errors. `Permission` - A Permission defines the

        level of access or control a user has over a specific feature. While

        inviting user, decide on the permission level required for the selected

        feature. Make sure the chosen permission is related to the selected feature.

        Features and their respective permissions are as below: - `email_campaigns`:

        - "create_edit_delete"

        - "send_schedule_suspend"

        - `sms_campaigns`:

        - "create_edit_delete"

        - "send_schedule_suspend"

        - `contacts`:

        - "view"

        - "create_edit_delete"

        - "import"

        - "export"

        - "list_and_attributes"

        - "forms"

        - `templates`:

        - "create_edit_delete"

        - "activate_deactivate"

        - `workflows`:

        - "create_edit_delete"

        - "activate_deactivate_pause"

        - "settings"

        - `landing_pages`:

        - "all"

        - `transactional_emails`:

        - "settings"

        - "logs"

        - `smtp_api`:

        - "smtp"

        - "api_keys"

        - "authorized_ips"

        - `user_management`:

        - "all"

        - `sales_platform`:

        - "create_edit_deals"

        - "delete_deals"

        - "manage_others_deals_tasks"

        - "reports"

        - "settings"

        - `phone`:

        - "all"

        - `conversations`:

        - "access"

        - "assign"

        - "configure"

        - `senders_domains_dedicated_ips`:

        - "senders_management"

        - "domains_management"

        - "dedicated_ips_management"

        - `push_notifications`:

        - "view"

        - "create_edit_delete"

        - "send"

        - "settings"

        - `companies`:

        - "manage_owned_companies"

        - "manage_other_companies"

        - "settings"

        **Note**: - If `all_features_access: false` then only privileges are

        required otherwise if `true` then it''s assumed that all permissions will be

        there for the invited user. - The availability of feature and its permission

        depends on your current plan. Please select the features and permissions

        accordingly.'
      tags:
      - User
      parameters:
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_inviteuser_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteuserRequestBadRequestError'
      requestBody:
        description: Values to create an invitation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inviteuser'
  /organization/user/update/permissions:
    post:
      operationId: EditUserPermission
      summary: Update permission for a user
      description: '`Feature` - A Feature represents a specific functionality like Email

        campaign, Deals, Calls, Automations, etc. on Brevo. While inviting a user,

        determine which feature you want to manage access to. You must specify the

        feature accurately to avoid errors. `Permission` - A Permission defines the

        level of access or control a user has over a specific feature. While

        inviting user, decide on the permission level required for the selected

        feature. Make sure the chosen permission is related to the selected feature.

        Features and their respective permissions are as below: - `email_campaigns`:

        - "create_edit_delete"

        - "send_schedule_suspend"

        - `sms_campaigns`:

        - "create_edit_delete"

        - "send_schedule_suspend"

