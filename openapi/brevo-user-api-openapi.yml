        - `transactional_emails`:

        - "settings"

        - "logs"

        - `smtp_api`:

        - "smtp"

        - "api_keys"

        - "authorized_ips"

        - `user_management`:

        - "all"

        - `sales_platform`:

        - "create_edit_deals"

        - "delete_deals"

        - "manage_others_deals_tasks"

        - "reports"

        - "settings"

        - `phone`:

        - "all"

        - `conversations`:

        - "access"

        - "assign"

        - "configure"

        - `senders_domains_dedicated_ips`:

        - "senders_management"

        - "domains_management"

        - "dedicated_ips_management"

        - `push_notifications`:

        - "view"

        - "create_edit_delete"

        - "send"

        - "settings"

        - `companies`:

        - "manage_owned_companies"

        - "manage_other_companies"

        - "settings"

        **Note**: - The privileges array remains the same as in the send invitation;

        the user simply needs to provide the permissions that need to be updated. -

        The availability of feature and its permission depends on your current plan.

        Please select the features and permissions accordingly.'
      tags:
      - User
      parameters:
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_EditUserPermission_Response_200'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditUserPermissionRequestBadRequestError'
      requestBody:
        description: Values to create an invitation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inviteuser'
