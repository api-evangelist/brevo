openapi: 3.2.0
info:
  title: Loyalty Balance API
  version: 1.0.0
servers:
- url: https://api.brevo.com/v3
  description: https://api.brevo.com/v3
tags:
- name: balance
paths:
  /loyalty/balance/programs/{pid}/balance-definitions:
    get:
      operationId: getBalanceDefinitionList
      summary: Get balance definition list
      description: Returns balance definition page
      tags:
      - balance
      parameters:
      - name: pid
        in: path
        description: Loyalty Program Id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Limit the number of records returned
        required: false
        schema:
          type: integer
          default: 200
      - name: offset
        in: query
        description: Offset to paginate records
        required: false
        schema:
          type: integer
          default: 0
      - name: sortField
        in: query
        description: Field to sort by
        required: false
        schema:
          $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersSortField'
          default: updated_at
      - name: sort
        in: query
        description: Sort direction
        required: false
        schema:
          $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersSort'
          default: desc
      - name: version
        in: query
        description: Version
        required: false
        schema:
          $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersVersion'
          default: draft
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of balance definition page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance_getBalanceDefinitionList_Response_200'
        '401':
          description: Request Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: Cannot Authenticate Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
    post:
      operationId: createBalanceDefinition
      summary: Create balance definition
      description: Creates balance definition and returns information
      tags:
      - balance
      parameters:
      - name: pid
        in: path
        description: Loyalty Program Id
        required: true
        schema:
          type: string
          format: uuid
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful creation of balance definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/balanceDefinition'
        '401':
          description: Request Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: Cannot Authenticate Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: No content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        description: Create Balance Definition Payload
        content:
          application/json:
            schema:
              type: object
              properties:
                balanceAvailabilityDurationModifier:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceAvailabilityDurationModifier'
                  description: Defines when the balance expires within the selected duration.
                balanceAvailabilityDurationUnit:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceAvailabilityDurationUnit'
                  description: Unit of time for balance validity.
                balanceAvailabilityDurationValue:
                  type: integer
                  description: Number of time units before the balance expires.
                balanceExpirationDate:
                  type: string
                  format: date
                  description: Fixed expiration date (`dd/mm` format) as an alternative to duration-based expiry.
                balanceOptionAmountOvertakingStrategy:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceOptionAmountOvertakingStrategy'
                  description: Defines whether partial credit is allowed when reaching max balance.
                balanceOptionCreditRounding:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceOptionCreditRounding'
                  description: Defines rounding strategy for credit transactions.
                balanceOptionDebitRounding:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceOptionDebitRounding'
                  description: Defines rounding strategy for debit transactions.
                description:
                  type: string
                  description: Short description of the balance definition.
                imageRef:
                  type: string
                  description: URL of an optional image reference.
                maxAmount:
                  type: number
                  format: double
                  description: Maximum allowable balance amount.
                maxCreditAmountLimit:
                  type: number
                  format: double
                  description: Maximum credit allowed per operation.
                maxDebitAmountLimit:
                  type: number
                  format: double
                  description: Maximum debit allowed per operation.
                meta:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaMeta'
                  description: Additional metadata for the balance definition.
                minAmount:
                  type: number
                  format: double
                  description: Minimum allowable balance amount.
                name:
                  type: string
                  description: Name of the balance definition.
                unit:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaUnit'
                  description: Unit of balance measurement.
              required:
              - name
              - unit
