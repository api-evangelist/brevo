      requestBody:
        description: Create Balance Definition Payload
        content:
          application/json:
            schema:
              type: object
              properties:
                balanceAvailabilityDurationModifier:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceAvailabilityDurationModifier'
                  description: Defines when the balance expires within the selected duration.
                balanceAvailabilityDurationUnit:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceAvailabilityDurationUnit'
                  description: Unit of time for balance validity.
                balanceAvailabilityDurationValue:
                  type: integer
                  description: Number of time units before the balance expires.
                balanceExpirationDate:
                  type: string
                  description: Expiration date (`dd/mm` format) or empty if not applicable.
                balanceOptionAmountOvertakingStrategy:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceOptionAmountOvertakingStrategy'
                  description: Defines whether partial credit is allowed when reaching max balance.
                balanceOptionCreditRounding:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceOptionCreditRounding'
                  description: Rounding strategy for credit transactions.
                balanceOptionDebitRounding:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceOptionDebitRounding'
                  description: Rounding strategy for debit transactions.
                description:
                  type: string
                  description: Short description of the balance definition.
                imageRef:
                  type: string
                  description: URL of an optional image reference.
                maxAmount:
                  type: number
                  format: double
                  description: Maximum allowable balance amount.
                maxCreditAmountLimit:
                  type: number
                  format: double
                  description: Maximum credit allowed per operation.
                maxDebitAmountLimit:
                  type: number
                  format: double
                  description: Maximum debit allowed per operation.
                meta:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaMeta'
                  description: Optional metadata for the balance definition.
                minAmount:
                  type: number
                  format: double
