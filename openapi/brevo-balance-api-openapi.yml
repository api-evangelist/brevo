            schema:
              type: object
              properties:
                constraintType:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidLimitsPostRequestBodyContentApplicationJsonSchemaConstraintType'
                  description: Defines whether the limit applies to transaction count or amount.
                durationUnit:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidLimitsPostRequestBodyContentApplicationJsonSchemaDurationUnit'
                  description: Unit of time for which the limit is applicable.
                durationValue:
                  type: integer
                  description: Number of time units for the balance limit.
                slidingSchedule:
                  type: boolean
                  description: Determines if the limit resets on a rolling schedule.
                transactionType:
                  $ref: '#/components/schemas/LoyaltyBalanceProgramsPidBalanceDefinitionsBdidLimitsPostRequestBodyContentApplicationJsonSchemaTransactionType'
                  description: Specifies whether the limit applies to credit or debit transactions.
                value:
                  type: integer
                  description: Maximum allowed value for the specified constraint type.
              required:
              - constraintType
              - durationUnit
              - durationValue
              - transactionType
              - value
