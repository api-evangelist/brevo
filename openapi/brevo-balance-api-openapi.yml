components:
  schemas:
    LoyaltyBalanceProgramsPidTransactionHistoryGetResponsesContentApplicationJsonSchemaTransactionHistoryItems:
      type: object
      properties:
        amount:
          type: string
          title: float
          description: The transaction amount.
        transactionType:
          $ref: '#/components/schemas/LoyaltyBalanceProgramsPidTransactionHistoryGetResponsesContentApplicationJsonSchemaTransactionHistoryItemsTransactionType'
          description: The type of the transaction.
        balanceExpirationDate:
          type: string
          description: Expiration date of the balance associated with this transaction.
        cancelledAt:
          type: string
          description: Timestamp when the transaction was canceled, if applicable.
        completedAt:
          type: string
          description: Timestamp when the transaction was successfully completed.
        createdAt:
          type: string
          description: Timestamp when the transaction was initiated.
        id:
          type: string
          description: Unique identifier of the transaction.
        meta:
          type: object
          additionalProperties:
            description: Any type
          description: Optional metadata associated with the transaction.
        rejectReason:
          type: string
          description: Reason for rejection, if the transaction was declined.
        rejectedAt:
          type: string
          description: Timestamp when the transaction was rejected.
        status:
          type: string
          description: Current status of the transaction (e.g., pending, completed, rejected).
      description: Represents a record of a past transaction, including status and key timestamps.
      title: LoyaltyBalanceProgramsPidTransactionHistoryGetResponsesContentApplicationJsonSchemaTransactionHistoryItems
    LoyaltyBalanceProgramsPidSubscriptionsCidBalancesGetResponsesContentApplicationJsonSchemaBalanceItems:
      type: object
      properties:
        balanceDefinitionId:
          type: string
          format: uuid
          description: Balance definition ID.
        value:
          type: string
          title: float
          description: Aggregate balance value for this definition.
      title: LoyaltyBalanceProgramsPidSubscriptionsCidBalancesGetResponsesContentApplicationJsonSchemaBalanceItems
    LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersVersion:
      type: string
      enum:
      - active
      - draft
      default: draft
      title: LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersVersion
    balanceDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the balance definition.
        name:
          type: string
          description: Name of the balance definition.
        description:
          type: string
          description: Short description of the balance definition.
        imageRef:
          type: string
          format: uri
          description: Optional image reference URL.
        meta:
          type: object
          additionalProperties:
            description: Any type
          description: Additional metadata for the balance definition.
        unit:
          $ref: '#/components/schemas/BalanceDefinitionUnit'
          description: Unit of balance measurement.
        minAmount:
          type: number
          format: double
          description: Minimum allowable balance.
        maxAmount:
          type: number
          format: double
          description: Maximum allowable balance.
        maxCreditAmountLimit:
          type: number
          format: double
          description: Maximum credit allowed per operation.
        maxDebitAmountLimit:
          type: number
          format: double
          description: Maximum debit allowed per operation.
        balanceOptionAmountOvertakingStrategy:
          $ref: '#/components/schemas/BalanceDefinitionBalanceOptionAmountOvertakingStrategy'
          description: Partial enables partial credit of balance if maximum balance limit is reached. Strict enables rejection of a transaction if it will breach the max balance limit.
        balanceOptionCreditRounding:
          $ref: '#/components/schemas/BalanceDefinitionBalanceOptionCreditRounding'
          description: Rounding strategy for credit transactions.
        balanceOptionDebitRounding:
          $ref: '#/components/schemas/BalanceDefinitionBalanceOptionDebitRounding'
          description: Rounding strategy for debit transactions.
        balanceAvailabilityDurationValue:
          type: integer
          description: Number of time units before the balance expires.
        balanceAvailabilityDurationUnit:
          $ref: '#/components/schemas/BalanceDefinitionBalanceAvailabilityDurationUnit'
          description: Unit of time for the balance availability duration.
        balanceAvailabilityDurationModifier:
          $ref: '#/components/schemas/BalanceDefinitionBalanceAvailabilityDurationModifier'
          description: Modifier for balance availability duration. startOfPeriod causes expiry at the start of the period, endOfPeriod at the end. noModification uses the exact duration from the credit date.
        balanceExpirationDate:
          type: string
          description: Fixed expiration date in dd/mm format. The balance expires when this date next appears in the calendar. Only one of balanceExpirationDate or balance availability duration fields can be used.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of balance definition creation.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update.
        deletedAt:
          type: string
          format: date-time
          description: Timestamp of balance definition deletion (nullable).
      title: balanceDefinition
    LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersSortField:
      type: string
      enum:
      - name
      - created_at
      - updated_at
      default: updated_at
      title: LoyaltyBalanceProgramsPidBalanceDefinitionsGetParametersSortField
    BalanceDefinitionBalanceOptionDebitRounding:
      type: string
      enum:
      - lower
      - upper
      - natural
      description: Rounding strategy for debit transactions.
      title: BalanceDefinitionBalanceOptionDebitRounding
    LoyaltyBalanceProgramsPidActiveBalanceGetResponsesContentApplicationJsonSchemaActiveBalancesItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the balance entry.
        amount:
          type: string
          title: float
          description: Current balance amount.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the balance was created.
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the balance expires (if applicable).
      title: LoyaltyBalanceProgramsPidActiveBalanceGetResponsesContentApplicationJsonSchemaActiveBalancesItems
    LoyaltyBalanceProgramsPidActiveBalanceGetParametersSort:
      type: string
      enum:
      - asc
      - desc
      title: LoyaltyBalanceProgramsPidActiveBalanceGetParametersSort
    LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceOptionCreditRounding:
      type: string
      enum:
      - lower
      - upper
      - natural
      description: Rounding strategy for credit transactions.
      title: LoyaltyBalanceProgramsPidBalanceDefinitionsBdidPutRequestBodyContentApplicationJsonSchemaBalanceOptionCreditRounding
    balanceLimit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the balance limit.
        balanceDefinitionId:
          type: string
          format: uuid
          description: Balance definition ID.
        transactionType:
          $ref: '#/components/schemas/BalanceLimitTransactionType'
          description: Specifies whether the limit applies to credit or debit transactions.
        constraintType:
          $ref: '#/components/schemas/BalanceLimitConstraintType'
          description: Defines the type of constraint (transaction count or amount).
        durationValue:
          type: integer
          description: Number of time units the balance limit applies to.
        durationUnit:
          $ref: '#/components/schemas/BalanceLimitDurationUnit'
          description: Time unit for the balance limit.
        value:
          type: number
          format: double
          description: The maximum allowed value for the defined constraint.
        slidingSchedule:
          type: boolean
          description: Indicates if the limit resets periodically based on a sliding schedule.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the balance limit was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update to the balance limit.
      title: balanceLimit
    Balance_getSubscriptionBalances_Response_200:
      type: object
      properties:
        loyaltyProgramId:
          type: string
          format: uuid
          description: Unique identifier of the loyalty program.
        contactId:
          type: integer
          format: int64
          description: Unique identifier of the contact.
        balance:
          type: array
          items:
            $ref: '#/components/schemas/LoyaltyBalanceProgramsPidSubscriptionsCidBalancesGetResponsesContentApplicationJsonSchemaBalanceItems'
          description: Aggregate balance per balance definition.
      title: Balance_getSubscriptionBalances_Response_200
    LoyaltyBalanceProgramsPidBalanceDefinitionsPostRequestBodyContentApplicationJsonSchemaBalanceAvailabilityDurationModifier:
      type: string
      enum:
