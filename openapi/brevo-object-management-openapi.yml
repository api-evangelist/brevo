      title: ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItemsAssociationsItems
    ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItemsAttributes:
      type: object
      properties: {}
      description: >
        Key-value pairs of attribute data for the object record. Each key is the attribute **key** (e.g.,
        `company_name`, `engine_type`), not the attribute label (e.g., "Company Name", "Engine Type"). Only attributes
        that already exist in the object schema will be present.

        For `category` or `multiple_category` attributes, the value is the option **key** (not the option label or
        option ID).
      title: ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItemsAttributes
    ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItemsIdentifiers:
      type: object
      properties:
        ext_id:
          type: string
          description: External ID of the record in your system.
        id:
          type: integer
          description: Internal ID of the object record generated by Brevo.
      description: |
        Identifiers for the object record. Supports `id` (singular, not `ids`) or `ext_id`.
        - `ext_id`: Your external system's identifier for this record.
        - `id`: Internal Brevo record ID.
      title: ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItemsIdentifiers
    ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItems:
      type: object
      properties:
