          description: |
            Identifiers for the object record. Supports `id` (singular, not `ids`) or `ext_id`.
            - `ext_id`: Your external system's identifier for this record.
            - `id`: Internal Brevo record ID.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the object record was last updated
      title: ObjectsObjectTypeRecordsGetResponsesContentApplicationJsonSchemaRecordsItems
