  /emailCampaigns/{campaignId}/exportRecipients:
    post:
      operationId: emailExportRecipients
      summary: Export the recipients of an email campaign
      description: Export the recipients of a sent email campaign as an asynchronous process, filtered by recipient type (e.g. openers, clickers, hardBounces). The recipientsType field is required and determines which subset of recipients to export. An optional notifyURL webhook will be called once the export is complete, and the response returns a processId to track the export status.
      tags:
      - emailCampaigns
      parameters:
      - name: campaignId
        in: path
        description: Id of the campaign
        required: true
        schema:
          type: integer
          format: int64
      - name: api-key
        in: header
        description: The API key should be passed in the request headers as `api-key` for authentication.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: process id created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email_Campaigns_emailExportRecipients_Response_202'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailExportRecipientsRequestBadRequestError'
        '404':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailExportRecipientsRequestNotFoundError'
      requestBody:
        description: Values to send for a recipient export request
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyURL:
                  type: string
                  format: url
                  description: Webhook called once the export process is finished. For reference, https://help.brevo.com/hc/en-us/articles/360007666479
                recipientsType:
                  $ref: '#/components/schemas/EmailCampaignsCampaignIdExportRecipientsPostRequestBodyContentApplicationJsonSchemaRecipientsType'
                  description: Type of recipients to export for a campaign
              required:
              - recipientsType
