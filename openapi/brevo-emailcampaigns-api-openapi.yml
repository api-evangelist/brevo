    EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItems:
      type: object
      properties:
        attachmentFile:
          type: string
          description: Url of the attachment file. Only available if the campaign has an attachment.
        abTesting:
          type: boolean
          description: Status of A/B Test for the campaign. abTesting = false means it is disabled, & abTesting = true means it is enabled.
        id:
          type: integer
          format: int64
          description: ID of the campaign
        name:
          type: string
          description: Name of the campaign
        previewText:
          type: string
          description: Preview text or preheader of the email campaign
        scheduledAt:
          type: string
          description: UTC date-time on which campaign is scheduled (YYYY-MM-DDTHH:mm:ss.SSSZ)
        sendAtBestTime:
          type: boolean
          description: It is true if you have chosen to send your campaign at best time, otherwise it is false
        splitRule:
          type: integer
          description: The size of your ab-test groups. Only available if `abTesting` flag of the campaign is `true`
        status:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus'
          description: Status of the campaign
        subject:
          type: string
          description: Subject of the campaign. Only available if `abTesting` flag of the campaign is `false`
        subjectA:
          type: string
          description: Subject A of the ab-test campaign. Only available if `abTesting` flag of the campaign is `true`
        subjectB:
          type: string
          description: Subject B of the ab-test campaign. Only available if `abTesting` flag of the campaign is `true`
        type:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsType'
          description: Type of campaign
        winnerCriteria:
          type: string
          description: Criteria for the winning version. Only available if `abTesting` flag of the campaign is `true`
        winnerDelay:
          type: integer
          description: The duration of the test in hours at the end of which the winning version will be sent. Only available if `abTesting` flag of the campaign is `true`
        attachmentUrl:
          type: string
          description: URL of the attachment file associated with the campaign. Empty string if no attachment is present.
        createdAt:
          type: string
          description: Creation UTC date-time of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
        emailExpirationDate:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsEmailExpirationDate'
          description: Expiration date configuration for the email campaign, if set. Contains the duration and unit of the email expiry.
        footer:
          type: string
          description: Footer of the campaign
        header:
          type: string
          description: Header of the campaign
        htmlContent:
          type: string
          description: HTML content of the campaign
        inlineImageActivation:
          type: boolean
          description: Status of inline image. inlineImageActivation = false means image can’t be embedded, & inlineImageActivation = true means image can be embedded, in the email.
        mirrorActive:
          type: boolean
          description: Status of mirror links in campaign. mirrorActive = false means mirror links are deactivated, & mirrorActive = true means mirror links are activated, in the campaign
        modifiedAt:
          type: string
          description: UTC date-time of last modification of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ)
        recurring:
          type: boolean
          description: FOR TRIGGER ONLY ! Type of trigger campaign.recurring = false means contact can receive the same Trigger campaign only once, & recurring = true means contact can receive the same Trigger campaign several times
        replyTo:
          type: string
          format: email
          description: Email defined as the "Reply to" of the campaign
        returnBounce:
          type: integer
          format: int64
          description: Total number of non-delivered campaigns for a particular campaign id.
        sender:
          $ref: '#/components/schemas/EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsSender'
        sentDate:
          type: string
          description: Sent UTC date-time of the campaign (YYYY-MM-DDTHH:mm:ss.SSSZ). Only available if 'status' of the campaign is 'sent'
        shareLink:
          type: string
          format: url
          description: Link to share the campaign on social medias
        tag:
          type: string
          description: Tag of the campaign
        tags:
          type: array
          items:
            type: string
          description: List of tags of the campaign
        testSent:
          type: boolean
          description: Retrieved the status of test email sending. (true=Test email has been sent  false=Test email has not been sent)
        toField:
          type: string
          description: Customisation of the "to" field of the campaign
        utmCampaignValue:
          type: string
          description: The utm_campaign value associated with the campaign. Only present if a UTM campaign value was set.
        utmContent:
          type: string
          description: The utm_content value associated with the campaign. Only present if a utm_content value was set on create or update.
        utmID:
          type: integer
          format: int64
          description: The campaign ID used as utm_id parameter. Only present if UTM campaign tracking with ID is enabled.
        utmMedium:
          type: string
          description: The utm_medium value. Set to "EMAIL" when UTM campaign tracking is enabled.
        utmSource:
          type: string
          description: The utm_source value. Set to "Brevo" when UTM campaign tracking is enabled.
        utmTerm:
          type: string
          description: The utm_term value associated with the campaign. Only present if a utm_term value was set on create or update.
        recipients:
          $ref: '#/components/schemas/getCampaignRecipients'
        statistics:
          $ref: '#/components/schemas/getExtendedCampaignStats'
      required:
      - id
      - name
      - status
      - type
      - createdAt
      - footer
      - header
      - htmlContent
      - modifiedAt
      - replyTo
      - sender
      - testSent
      - recipients
      - statistics
      title: EmailCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItems
