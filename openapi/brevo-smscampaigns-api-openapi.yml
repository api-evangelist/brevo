      - suspended
      - inProcess
      description: Status of the SMS Campaign
      title: SmsCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus
    SmsCampaignsGetResponsesContentApplicationJsonSchemaCode:
