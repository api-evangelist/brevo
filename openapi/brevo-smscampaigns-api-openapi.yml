    SendSmsReportRequestNotFoundError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/SmsCampaignsCampaignIdSendReportPostResponsesContentApplicationJsonSchemaCode'
          description: Error code displayed in case of a failure
        message:
          type: string
          description: Readable message associated to the failure
      required:
      - code
      - message
      title: SendSmsReportRequestNotFoundError
    GetSmsCampaignsRequestBadRequestError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/SmsCampaignsGetResponsesContentApplicationJsonSchemaCode'
          description: Error code displayed in case of a failure
        message:
          type: string
          description: Readable message associated to the failure
      required:
      - code
      - message
      title: GetSmsCampaignsRequestBadRequestError
    SmsCampaignsGetResponsesContentApplicationJsonSchemaCampaignsItemsStatus:
      type: string
      enum:
      - draft
