      title: SmsCampaignsCampaignIdSendTestPostResponsesContentApplicationJsonSchemaCode
    SmsCampaignsPostRequestBodyContentApplicationJsonSchemaRecipients:
      type: object
      properties:
        exclusionListIds:
          type: array
          items:
            type: integer
            format: int64
          description: List ids which have to be excluded from a campaign
        listIds:
          type: array
          items:
            type: integer
            format: int64
          description: 'Lists Ids to send the campaign to. **REQUIRED if scheduledAt is not empty**

            '
      required:
      - listIds
      title: SmsCampaignsPostRequestBodyContentApplicationJsonSchemaRecipients
    SmsCampaignsGetParametersSort:
      type: string
      enum:
      - asc
      - desc
      default: desc
      title: SmsCampaignsGetParametersSort
    SmsCampaignsCampaignIdGetResponsesContentApplicationJsonSchemaStatus:
      type: string
      enum:
      - draft
      - sent
      - archive
      - queued
      - suspended
      - inProcess
      description: Status of the SMS Campaign
      title: SmsCampaignsCampaignIdGetResponsesContentApplicationJsonSchemaStatus
