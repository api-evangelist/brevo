description: >-
  Brevo's API has been on v3 in the URI path for its whole public life; there is no version
  header, no date-pinned train, and no published breaking-change or support-window policy
  document. What Brevo does have is a disciplined dated changelog that labels breaking
  changes explicitly and, when it retires an endpoint, publishes a named deprecation notice
  with an effective date and a replacement — the POST /contacts/batch retirement dated
  2026-10-30 is the current live example. There is no RFC 8594 Sunset/Deprecation header
  support and none of the 285 published operations carries `deprecated: true` in the spec,
  so the retirement is discoverable only from the changelog, not from the contract.
versioning:
  scheme: uri-path
  current: v3
  base_url: https://api.brevo.com/v3
  header_versioning: false
  date_versioning: false
  policy_url: null
  note: Version has not incremented since v3; change is communicated through the changelog.
deprecation:
