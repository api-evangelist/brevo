  sunset_header: false
  deprecation_header: false
  spec_deprecated_flag: false
  announced_via: https://developers.brevo.com/changelog
  notice_period_observed: ~5.5 months (announced 2026-05-12, effective 2026-10-30)
  deprecations:
  - operation: POST /contacts/batch
    name: Update Multiple Contacts
    announced: '2026-05-12'
    effective: '2026-10-30'
    replacement: POST /v3/contacts/import (operationId importContacts)
    url: https://developers.brevo.com/changelog/2026/5/12
    note: >-
      "The deprecated endpoint may stop functioning after the deprecation date." The
      endpoint is already absent from the published contact-management OpenAPI, so a client
      generated from the current spec will not have it.
