description: >-
  Brevo publishes seven official server-side SDKs plus a first-party developer CLI, all
  under the github.com/getbrevo organization and listed on the SDKs and libraries docs page.
  The JavaScript, Python and PHP SDKs are on a shared release train (5.x/6.x, all republished
  2026-08-10). Java, C#, Go and Ruby lag materially behind that train: the Go client has not
  shipped since 2025-02, Ruby since 2025-06, C# since 2026-02. The legacy pre-rebrand
  packages (sib-api-v3-sdk on npm and PyPI) are superseded and are recorded here as
  deprecated predecessors, not as current clients.
