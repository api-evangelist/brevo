tools:
  status: gated
  note: >-
    The live tool list is auth-gated — tools/list returns 401 without a Bearer MCP token,
    so per-tool inputSchema could not be introspected anonymously and NO tool list is
    asserted here. Brevo publishes module names and descriptions but not a tool-level
    manifest. mcp/brevo-tool-crosswalk.yml maps each published module to the backing
    OpenAPI operations by name and path semantics, with confidence recorded honestly.
docs_mcp:
  endpoint: https://developers.brevo.com/_mcp/server
  auth: none
  verified: probed
  server_info:
    name: fern-docs-mcp-server
    version: 1.0.0
    protocolVersion: '2025-11-25'
  note: >-
    A SECOND, separate MCP server — the documentation search server Brevo's Fern-hosted
    developer portal exposes, advertised in llms.txt. It answers an anonymous initialize
    handshake over text/event-stream (probed 2026-08-13). It serves docs retrieval, not
    account operations; the account surface is mcp.brevo.com above. Recorded separately so
    the two are never conflated.
