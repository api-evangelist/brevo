generated: '2026-08-13'
method: searched
status: published
source: https://developers.brevo.com/docs/mcp-protocol
docs:
- https://developers.brevo.com/docs/mcp-protocol
- https://developers.brevo.com/docs/integration-guide
description: >-
  Brevo ships a hosted, remote MCP server at https://mcp.brevo.com. An agent POSTs directly
  to the endpoint with a Bearer MCP token minted in the Brevo dashboard (Account > SMTP & API
  > API Keys, with the "Create MCP server API key" toggle on) — no local install required.
  Brevo splits the surface into one combined server covering 27 modules and 27 per-module
  servers, so a client can load a narrower tool set. The endpoint also advertises RFC 8414
  authorization-server metadata with dynamic client registration and PKCE, so an OAuth
  client can register itself rather than pasting a static token.
deployment:
  mode: remote
  endpoint: https://mcp.brevo.com/v1/brevo/mcp
  auth: api-key
  verified: probed
  note: >-
    Probed 2026-08-13 — an anonymous tools/list POST to the endpoint returns HTTP 401
    {"error":"invalid_token","error_description":"Authentication required"}, confirming a
    live, auth-gated MCP surface rather than a 404. Authentication is a Bearer MCP token
    (`Authorization: Bearer <BREVO_MCP_TOKEN>`); the same endpoint additionally publishes
    OAuth metadata at https://mcp.brevo.com/.well-known/oauth-authorization-server
    (authorization_code + refresh_token, PKCE S256, dynamic client registration,
    scopes_supported ["all"]). Brevo's own configuration examples for Claude Desktop and
    Claude Code wrap the remote endpoint in `npx mcp-remote` as a bridge — that is a
    client-side shim over the hosted URL, not a stdio server Brevo distributes, so the
    mode here is remote, not both.
server:
  name: brevo
  transport: http
  url: https://mcp.brevo.com/v1/brevo/mcp
  base_url: https://mcp.brevo.com
  module_count: 27
  token_scope: full read/write on the account (per Brevo's own warning in the tool
    configuration guide)
oauth:
  issuer: https://mcp.brevo.com
  authorization_endpoint: https://mcp.brevo.com/oauth/authorize
  token_endpoint: https://mcp.brevo.com/oauth/token
  registration_endpoint: https://mcp.brevo.com/oauth/register
  grant_types: [authorization_code, refresh_token]
  code_challenge_methods: [S256]
  scopes_supported: [all]
  source: well-known/brevo-mcp-oauth-authorization-server.json
