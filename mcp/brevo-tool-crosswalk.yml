source: mcp/brevo-mcp.yml + openapi/brevo-*-openapi.yml (13 provider-published specs)
description: >-
  Binds Brevo's published MCP surface to the machine-readable REST core. Brevo's hosted MCP
  server is auth-gated — an anonymous tools/list returns 401 — so per-tool names and
  inputSchemas could NOT be introspected. What Brevo does publish is a module manifest: one
  combined server plus 27 named per-module servers, each with a one-line description. This
  crosswalk therefore maps at MODULE granularity, not tool granularity, binding each
  published module to the OpenAPI operationIds that cover the same resource. Every
  operationId below was read out of the harvested specs; none is invented. Confidence is
  `high` where the module name matches an OpenAPI tag or path prefix one-to-one, `medium`
  where the module spans or splits a tag.
surfaces:
  openapi:
    files: openapi/brevo-*-openapi.yml
    count: 13
    operations: 285
    source: https://developers.brevo.com/.well-known/api-catalog
    gated: false
  mcp:
    url: https://mcp.brevo.com/v1/brevo/mcp
    modules: 27
    gated: true
    note: tools/list returns 401 invalid_token without a Bearer MCP token
  graphql:
    endpoint: null
    note: >-
      Brevo publishes no GraphQL endpoint. The graphql/ directory in this repo holds a
      conceptual REST-to-GraphQL translation authored by API Evangelist, clearly labelled
      as such in graphql/brevo-graphql.md — it is NOT a Brevo surface and is excluded here.
