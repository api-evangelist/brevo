  authorization-server metadata on both the partner OAuth realm and the hosted MCP server.
  The API host (api.brevo.com) serves no /.well-known/ surface at all, and neither the
  marketing site (www.brevo.com, a Next.js app that answers 500 on every /.well-known/ path)
  nor the apex (brevo.com, an unrouted Vercel deployment) serves one.
